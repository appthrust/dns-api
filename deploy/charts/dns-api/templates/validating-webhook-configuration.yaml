{{- if .Values.webhook.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "dns-api.fullname" . }}-validating-webhook-configuration
  labels:
    {{- include "dns-api.labels" . | nindent 4 }}
  {{- if .Values.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "dns-api.webhookCertificateName" . }}
  {{- end }}
webhooks:
  - name: providers.dns.appthrust.io
    admissionReviewVersions:
      - v1
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    clientConfig:
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ include "dns-api.webhookServiceName" . }}
        path: /validate-dns-appthrust-io-v1alpha1-provider
    rules:
      - apiGroups:
          - dns.appthrust.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - providers
  - name: zoneclasses.dns.appthrust.io
    admissionReviewVersions:
      - v1
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    clientConfig:
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ include "dns-api.webhookServiceName" . }}
        path: /validate-dns-appthrust-io-v1alpha1-zoneclass
    rules:
      - apiGroups:
          - dns.appthrust.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - zoneclasses
          - zoneclasses/status
  {{- if .Values.providers.route53.enabled }}
  - name: route53identities.route53.dns.appthrust.io
    admissionReviewVersions:
      - v1
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    clientConfig:
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ include "dns-api.webhookServiceName" . }}
        path: /validate-route53-dns-appthrust-io-v1alpha1-route53identity
    rules:
      - apiGroups:
          - route53.dns.appthrust.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - route53identities
          - route53identities/status
  {{- end }}
  {{- if .Values.providers.cloudflare.enabled }}
  - name: cloudflareidentities.cloudflare.dns.appthrust.io
    admissionReviewVersions:
      - v1
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    clientConfig:
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ include "dns-api.webhookServiceName" . }}
        path: /validate-cloudflare-dns-appthrust-io-v1alpha1-cloudflareidentity
    rules:
      - apiGroups:
          - cloudflare.dns.appthrust.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - cloudflareidentities
          - cloudflareidentities/status
  {{- end }}
  - name: zones.dns.appthrust.io
    admissionReviewVersions:
      - v1
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    clientConfig:
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ include "dns-api.webhookServiceName" . }}
        path: /validate-dns-appthrust-io-v1alpha1-zone
    rules:
      - apiGroups:
          - dns.appthrust.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - zones
          - zones/status
  - name: recordsets.dns.appthrust.io
    admissionReviewVersions:
      - v1
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    clientConfig:
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ include "dns-api.webhookServiceName" . }}
        path: /validate-dns-appthrust-io-v1alpha1-recordset
    rules:
      - apiGroups:
          - dns.appthrust.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - recordsets
          - recordsets/status
  {{- range $kind := list "recordwithdrawal" "recordwithdrawalwaiver" }}
  - name: {{ $kind }}s.dns.appthrust.io
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: {{ $.Values.webhook.failurePolicy }}
    clientConfig:
      service:
        namespace: {{ $.Release.Namespace }}
        name: {{ include "dns-api.webhookServiceName" $ }}
        path: /validate-dns-appthrust-io-v1alpha1-{{ $kind }}
    rules:
      - apiGroups: [dns.appthrust.io]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [{{ $kind }}s, {{ $kind }}s/status]
  {{- end }}
  - name: zoneunits.dns.appthrust.io
    admissionReviewVersions:
      - v1
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    clientConfig:
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ include "dns-api.webhookServiceName" . }}
        path: /validate-dns-appthrust-io-v1alpha1-zoneunit
    rules:
      - apiGroups:
          - dns.appthrust.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
          - DELETE
        resources:
          - zoneunits
          - zoneunits/status
{{- end }}

