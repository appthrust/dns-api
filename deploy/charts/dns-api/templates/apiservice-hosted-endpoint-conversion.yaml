{{- if .Values.providers.hosted.enabled }}
{{- if not (and .Values.webhook.enabled .Values.certManager.enabled) }}
{{- fail "providers.hosted.enabled requires webhook.enabled=true and certManager.enabled=true" }}
{{- end }}
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.endpoint.hosted.dns.appthrust.io
  labels:
    {{- include "dns-api.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "dns-api.webhookCertificateName" . }}
spec:
  group: endpoint.hosted.dns.appthrust.io
  version: v1alpha1
  groupPriorityMinimum: 1000
  versionPriority: 15
  service:
    name: {{ include "dns-api.webhookServiceName" . }}
    namespace: {{ .Release.Namespace }}
    port: {{ .Values.webhook.service.port }}
{{- end }}
