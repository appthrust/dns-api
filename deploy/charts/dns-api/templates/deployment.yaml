apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dns-api.fullname" . }}-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dns-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller-manager
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "dns-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dns-api.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "dns-api.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect={{ .Values.leaderElection.enabled }}
            - --endpoint-recordset-namespace={{ .Values.endpoint.recordSetNamespace }}
            - --gateway-endpoint-controller-enabled={{ .Values.gatewayEndpoint.enabled }}
            - --service-endpoint-controller-enabled={{ .Values.serviceEndpoint.enabled }}
            - --route53-controller-enabled={{ .Values.providers.route53.enabled }}
            - --cloudflare-controller-enabled={{ .Values.providers.cloudflare.enabled }}
            - --route53-endpoint-conversion-enabled={{ and .Values.providers.route53.enabled .Values.providers.route53.endpoint.conversionAPI.enabled .Values.webhook.enabled }}
            - --external-controller-enabled={{ .Values.providers.external.enabled }}
            {{- if .Values.providers.external.enabled }}
            - {{ printf "--external-controller-name=%s" .Values.providers.external.controllerName | quote }}
            - {{ printf "--external-provider-name=%s" .Values.providers.external.providerName | quote }}
            - {{ printf "--external-provider-version=%s" .Values.providers.external.providerVersion | quote }}
            - --external-dns-qps={{ .Values.providers.external.dnsQPS }}
            - --external-dns-burst={{ .Values.providers.external.dnsBurst }}
            {{- end }}
            - --hosted-controller-enabled={{ .Values.providers.hosted.enabled }}
            {{- if .Values.providers.hosted.enabled }}
            - {{ printf "--hosted-controller-name=%s" .Values.providers.hosted.controllerName | quote }}
            - {{ printf "--hosted-provider-name=%s" .Values.providers.hosted.providerName | quote }}
            - {{ printf "--hosted-provider-version=%s" .Values.providers.hosted.providerVersion | quote }}
            - --hosted-endpoint-ttl={{ .Values.providers.hosted.endpointTTL }}
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- if or .Values.providers.hosted.enabled .Values.extraEnv }}
          env:
            {{- if .Values.providers.hosted.enabled }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOSTED_SERVER_ADDRESS
              value: {{ printf "%s.%s.svc:53" (include "dns-api.hostedServerName" .) .Release.Namespace | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            - name: healthz
              containerPort: {{ .Values.health.port }}
            {{- if .Values.webhook.enabled }}
            - name: webhook-server
              containerPort: {{ .Values.webhook.port }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.health.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.health.port }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.webhook.enabled }}
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.webhook.enabled }}
      volumes:
        - name: webhook-certs
          secret:
            secretName: {{ include "dns-api.webhookSecretName" . }}
      {{- end }}
